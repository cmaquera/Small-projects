<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Juego con Phaser</title>
	<link rel="stylesheet" href="../shared.css">
	<script type="text/javascript" src="phaser.min.js"></script>
	<style type="text/css">
		.juego {
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 1rem .5rem 0;
			width: 100%;
			box-sizing: border-box;
		}
		.hud {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			width: 100%;
			max-width: 500px;
			box-sizing: border-box;
			padding: .4rem .75rem;
			margin-bottom: .5rem;
			background: rgba(13,13,13,.55);
			border: 2px solid #16F24D;
			border-radius: 8px;
			font-family: 'Droid Sans Mono', monospace;
		}
		.hud .marcador {
			color: #6DF28E;
			font-weight: bold;
			font-size: 14px;
		}
		.hud .ayuda {
			color: #16F24D;
			font-size: 11px;
		}
		.juego canvas {
			border: 2px solid #16F24D;
			border-radius: 8px;
			max-width: 100%;
			height: auto;
			display: block;
		}
		.victoria {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 20;
			align-items: center;
			justify-content: center;
			background: rgba(13,13,13,.85);
			font-family: 'Droid Sans Mono', monospace;
			text-align: center;
		}
		.victoria.visible {
			display: flex;
		}
		.victoria .mensaje {
			color: #16F24D;
			font-size: 26px;
			font-weight: bold;
		}
		.victoria .sub {
			color: #6DF28E;
			font-size: 14px;
			margin-top: .5rem;
		}
		.controles {
			text-align: center;
			padding: 1rem 0 1.5rem;
		}
		.controles .btn {
			margin: 4px 6px;
			font-size: 24px;
			min-width: 64px;
			min-height: 56px;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
			touch-action: manipulation;
			line-height: 1.2;
		}
	</style>
</head>
<body>
	<header class="site-header">
		<a class="back-link" href="../index.html">← Volver al índice</a>
		<h1>Juego con Phaser</h1>
	</header>
	<div id="game" class="juego">
		<div class="hud">
			<span class="marcador" id="marcador">Monedas: 0/0</span>
			<span class="ayuda">← → mover · ↑/ESP saltar</span>
		</div>
	</div>
	<div class="victoria" id="victoria">
		<div>
			<div class="mensaje">¡GANASTE!</div>
			<div class="sub">Pulsa R o el botón Reiniciar</div>
		</div>
	</div>
	<div class="controles">
		<button class="btn btn1" id="btn-izq" type="button">◀</button>
		<button class="btn btn1" id="btn-der" type="button">▶</button>
		<button class="btn btn1" id="btn-salto" type="button">⤒</button>
		<button class="btn btn1" id="btn-reiniciar" type="button">Reiniciar</button>
	</div>
	<footer class="site-footer">Creado por <a href="https://github.com/cmaquera">CMaquera</a></footer>

	<script type="text/javascript">
		var controles = { izq: false, der: false, salto: false };

		function btnPulsar(id, propiedad) {
			var b = document.getElementById(id);
			if (!b) { return; }
			var act = function (v) { return function (e) { controles[propiedad] = v; e.preventDefault(); }; };
			b.addEventListener('touchstart', act(true), false);
			b.addEventListener('touchmove', act(true), false);
			b.addEventListener('touchend', act(false), false);
			b.addEventListener('touchcancel', act(false), false);
			b.addEventListener('mousedown', act(true), false);
			b.addEventListener('mouseup', act(false), false);
			b.addEventListener('mouseleave', act(false), false);
		}
		btnPulsar('btn-izq', 'izq');
		btnPulsar('btn-der', 'der');
		btnPulsar('btn-salto', 'salto');

		var mainState = {
			preload: function () {
				game.load.image('player', 'assets/player.png');
				game.load.image('wall', 'assets/wall.png');
				game.load.image('coin', 'assets/coin.png');
				game.load.image('enemy', 'assets/enemy.png');
			},

			create: function () {
				game.stage.backgroundColor = "#12202b";
				game.physics.startSystem(Phaser.Physics.ARCADE);

				this.cursor = game.input.keyboard.createCursorKeys();
				this.espacio = game.input.keyboard.addKey(Phaser.Keyboard.SPACEBAR);
				this.teclaR = game.input.keyboard.addKey(Phaser.Keyboard.R);

				this.player = game.add.sprite(70, 100, 'player');
				game.physics.arcade.enable(this.player);
				this.player.body.gravity.y = 700;
				this.player.body.collideWorldBounds = true;

				this.walls = game.add.group();
				this.coins = game.add.group();
				this.enemies = game.add.group();

				this.monedas = 0;
				this.totalMonedas = 0;
				this.ganado = false;
				this.saltoPendiente = false;
				this.saltoAnterior = false;
				this.ultimaTierra = -999;
				this.pendienteDesde = 0;
				this.saltoUsado = false;

				var level = [
					'xxxxxxxxxxxxxxxxxxxxxx',
					'x     o          o   x',
					'x   o  x             x',
					'x      x           o x',
					'x    x     xx   o   Xx',
					'x  o x     x   !     x',
					'xxxxxxxxxxxxxxxxxxxxxx'
				];

				for (var i = 0; i < level.length; i++) {
					for (var j = 0; j < level[i].length; j++) {
						var c = level[i][j];
						var px = 30 + 20 * j;
						var py = 30 + 20 * i;
						if (c === 'x') {
							var wall = game.add.sprite(px, py, 'wall');
							game.physics.arcade.enable(wall);
							wall.body.immovable = true;
							this.walls.add(wall);
						} else if (c === 'o') {
							var coin = game.add.sprite(px, py, 'coin');
							game.physics.arcade.enable(coin);
							this.coins.add(coin);
							this.totalMonedas++;
						} else if (c === '!') {
							var enemy = game.add.sprite(px, py, 'enemy');
							game.physics.arcade.enable(enemy);
							enemy.body.gravity.y = 700;
							enemy.body.collideWorldBounds = true;
							enemy.body.velocity.x = j % 2 === 0 ? 60 : -60;
							this.enemies.add(enemy);
						}
					}
				}

				this.marcadorDOM = document.getElementById('marcador');
				this.marcadorDOM.textContent = 'Monedas: 0/' + this.totalMonedas;
				this.victoriaDOM = document.getElementById('victoria');
				this.victoriaDOM.className = 'victoria';
			},

			update: function () {
				if (this.ganado) {
					if (this.cursor.up.isDown || this.espacio.isDown || this.teclaR.isDown || controles.salto) {
						game.state.start('main');
					}
					return;
				}

				var izquierda = this.cursor.left.isDown || controles.izq;
				var derecha = this.cursor.right.isDown || controles.der;

				if (izquierda) {
					this.player.body.velocity.x = -160;
					this.player.scale.x = -1;
				} else if (derecha) {
					this.player.body.velocity.x = 160;
					this.player.scale.x = 1;
				} else {
					this.player.body.velocity.x = 0;
				}

				game.physics.arcade.collide(this.player, this.walls);
				game.physics.arcade.collide(this.enemies, this.walls, function (enemy, wall) {
					if (enemy.body.blocked.left || enemy.body.touching.left) { enemy.body.velocity.x = 60; }
					else if (enemy.body.blocked.right || enemy.body.touching.right) { enemy.body.velocity.x = -60; }
				});

				var enSuelo = this.player.body.onFloor() || this.player.body.blocked.down || this.player.body.touching.down;
				if (enSuelo) {
					this.ultimaTierra = game.time.now;
					this.saltoUsado = false;
				}

				var saltoPresionado = this.cursor.up.isDown || this.espacio.isDown || controles.salto;
				if (saltoPresionado && !this.saltoAnterior) {
					this.saltoPendiente = true;
					this.pendienteDesde = game.time.now;
				}
				this.saltoAnterior = saltoPresionado;
				if (this.saltoPendiente && game.time.now - this.pendienteDesde > 200) {
					this.saltoPendiente = false;
				}

				var enCoyote = !enSuelo && (game.time.now - this.ultimaTierra <= 120);
				var puedeSaltar = (enSuelo || enCoyote) && !this.saltoUsado;

				if (this.saltoPendiente && puedeSaltar) {
					this.player.body.velocity.y = -300;
					this.saltoPendiente = false;
					this.saltoUsado = true;
				}

				game.physics.arcade.overlap(this.player, this.coins, this.takeCoin, null, this);
				game.physics.arcade.overlap(this.player, this.enemies, this.morir, null, this);

				if (this.player.y > game.world.height + 100) {
					game.state.start('main');
				}
			},

			takeCoin: function (player, coin) {
				coin.kill();
				this.monedas++;
				this.marcadorDOM.textContent = 'Monedas: ' + this.monedas + '/' + this.totalMonedas;
				if (this.monedas >= this.totalMonedas) {
					this.ganado = true;
					this.victoriaDOM.className = 'victoria visible';
				}
			},

			morir: function () {
				if (this.ganado) { return; }
				game.state.start('main');
			}
		};

		var game = new Phaser.Game(500, 210, Phaser.CANVAS, 'game');
		game.state.add('main', mainState);
		game.state.start('main');

		document.getElementById('btn-reiniciar').addEventListener('click', function () {
			game.state.start('main');
		}, false);
	</script>
</body>
</html>
